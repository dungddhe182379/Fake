<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Form Auto Submit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
        h1 { color: #333; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { background: #f8f9fa; padding: 25px; border-radius: 8px; margin-bottom: 25px; }
        .section-title { font-size: 20px; color: #667eea; margin-bottom: 20px; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus { outline: none; border-color: #667eea; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .btn-success { background: #51cf66; color: white; }
        .btn-success:hover { background: #40c057; }
        .btn-danger { background: #ff6b6b; color: white; }
        .btn-danger:hover { background: #ee5555; }
        .question-item {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #d3f9d8;
            color: #2b8a3e;
            border: 1px solid #51cf66;
        }
        .alert-error {
            background: #ffe0e0;
            color: #c92a2a;
            border: 1px solid #ff6b6b;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .progress-bar {
            width: 100%;
            height: 25px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #51cf66, #40c057);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
            transition: width 0.5s ease;
        }
        .accuracy-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: #e0e0e0;
            border-radius: 5px;
            outline: none;
        }
        .accuracy-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #667eea;
            cursor: pointer;
            border-radius: 50%;
        }
        .accuracy-display {
            display: inline-block;
            margin-left: 10px;
            font-weight: bold;
            color: #667eea;
            min-width: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Google Form Auto Submit</h1>
        <p class="subtitle">Import form → Tùy chỉnh tỉ lệ cho từng câu → Auto submit</p>

        <div id="alert-container"></div>

        <!-- Section 1: Import Form -->
        <div class="section">
            <h2 class="section-title">📝 Bước 1: Import Google Form</h2>
            
            <div class="form-group">
                <label>URL Google Form:</label>
                <input type="text" id="importUrl" placeholder="https://docs.google.com/forms/d/e/...">
            </div>

            <button class="btn btn-primary" onclick="importFromUrl()">📥 Import Form</button>
            
            <div class="loader" id="loader"></div>
        </div>

        <!-- Section 2: Questions -->
        <div class="section" id="questionsSection" style="display: none;">
            <h2 class="section-title">🎯 Bước 2: Tùy chỉnh tỉ lệ đúng cho từng câu</h2>
            
            <div id="questions-container"></div>

            <div style="margin-top: 20px;">
                <button class="btn btn-success" onclick="prepareSubmit()">✅ Hoàn tất & Chuẩn bị Submit</button>
            </div>
        </div>

        <!-- Section 3: Submit -->
        <div class="section" id="submitSection" style="display: none;">
            <h2 class="section-title">🚀 Bước 3: Auto Submit</h2>
            
            <div class="form-group">
                <label>Số lượng responses:</label>
                <input type="number" id="numResponses" value="10" min="1" max="1000">
            </div>

            <div class="form-group">
                <label>Delay giữa các lần submit (giây):</label>
                <input type="number" id="submitDelay" value="0.05" min="0" max="10" step="0.01">
                <small style="color: #666;">💡 20 threads song song: 0.05s = 100 requests trong ~10 giây!</small>
            </div>

            <button class="btn btn-success" onclick="autoSubmit()">🚀 Bắt đầu Auto Submit</button>

            <div id="submitProgress" style="margin-top: 20px; display: none;">
                <p id="progressText">Đang submit: 0/0</p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar" style="width: 0%">0%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let formData = null;
        let questions = [];

        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        async function importFromUrl() {
            const url = document.getElementById('importUrl').value.trim();
            if (!url) {
                showAlert('Vui lòng nhập URL!', 'error');
                return;
            }

            document.getElementById('loader').style.display = 'block';

            try {
                const response = await fetch('/api/import-from-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();
                document.getElementById('loader').style.display = 'none';
                
                if (response.ok) {
                    formData = data;
                    questions = data.questions;
                    displayQuestions(questions);
                    showAlert(`✅ ${data.message}`, 'success');
                } else {
                    showAlert(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                showAlert('❌ Lỗi khi import!', 'error');
                console.error(error);
            }
        }

        function displayQuestions(questions) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            questions.forEach((q, idx) => {
                const div = document.createElement('div');
                div.className = 'question-item';
                
                const isCheckbox = q.type === 'checkbox';
                
                let optionsHTML = '';
                
                if (isCheckbox) {
                    // CHECKBOX: Mỗi option có slider độc lập 0-100%
                    optionsHTML = `
                        <div class="form-group">
                            <label>Tỉ lệ chọn cho từng option (độc lập):</label>
                            <div style="margin-top: 10px;">
                                ${q.options.map((opt, optIdx) => `
                                    <div style="margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 6px;">
                                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                                            <strong>${opt}</strong>
                                            <span class="accuracy-display" id="option-rate-${idx}-${optIdx}" style="color: #667eea; font-size: 16px;">50%</span>
                                        </div>
                                        <input type="range" class="accuracy-slider" id="option-slider-${idx}-${optIdx}" 
                                               min="0" max="100" value="50"
                                               oninput="document.getElementById('option-rate-${idx}-${optIdx}').textContent = this.value + '%'"
                                               data-option="${opt}">
                                    </div>
                                `).join('')}
                            </div>
                            <small style="color: #666;">💡 Mỗi checkbox độc lập, có thể chọn nhiều cùng lúc</small>
                        </div>
                    `;
                } else {
                    // MULTIPLE CHOICE: Phân bổ % cho từng option, tổng = 100%
                    const perOption = Math.floor(100 / q.options.length);
                    const remainder = 100 - (perOption * q.options.length);
                    
                    optionsHTML = `
                        <div class="form-group">
                            <label>Phân bổ tỉ lệ cho từng option (tổng = 100%):</label>
                            <div style="margin-top: 10px;">
                                ${q.options.map((opt, optIdx) => {
                                    const defaultVal = optIdx === 0 ? perOption + remainder : perOption;
                                    return `
                                        <div style="margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 6px;">
                                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                                                <strong>${opt}</strong>
                                                <span class="accuracy-display" id="option-rate-${idx}-${optIdx}" style="color: #667eea; font-size: 16px;">${defaultVal}%</span>
                                            </div>
                                            <input type="range" class="accuracy-slider" id="option-slider-${idx}-${optIdx}" 
                                                   min="0" max="100" value="${defaultVal}"
                                                   oninput="updateMultipleChoiceRates(${idx}, ${q.options.length})"
                                                   data-option="${opt}">
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                            <div style="margin-top: 10px; padding: 10px; background: #e3f2fd; border-radius: 6px; text-align: center;">
                                <strong>Tổng: <span id="total-rate-${idx}" style="color: #1976d2; font-size: 18px;">100%</span></strong>
                            </div>
                            <small style="color: #666;">💡 Điều chỉnh % để tổng = 100%</small>
                        </div>
                    `;
                }
                
                div.innerHTML = `
                    <div class="question-header">
                        <strong>Câu ${idx + 1}: ${q.text}</strong>
                        <span style="font-size: 12px; color: #666;">[${isCheckbox ? 'CHECKBOX' : 'MULTIPLE CHOICE'}]</span>
                    </div>
                    ${optionsHTML}
                    <small style="color: #999; display: block; margin-top: 10px;">Entry ID: ${q.entry_id}</small>
                `;
                container.appendChild(div);
            });

            document.getElementById('questionsSection').style.display = 'block';
        }
        
        function updateMultipleChoiceRates(questionIdx, numOptions) {
            // Tính tổng % của multiple choice
            let total = 0;
            for (let i = 0; i < numOptions; i++) {
                const slider = document.getElementById(`option-slider-${questionIdx}-${i}`);
                const value = parseInt(slider.value);
                total += value;
                document.getElementById(`option-rate-${questionIdx}-${i}`).textContent = value + '%';
            }
            
            const totalDisplay = document.getElementById(`total-rate-${questionIdx}`);
            totalDisplay.textContent = total + '%';
            
            // Warning nếu không = 100%
            if (total !== 100) {
                totalDisplay.style.color = '#f44336';
            } else {
                totalDisplay.style.color = '#1976d2';
            }
        }

        function prepareSubmit() {
            // Update questions với option rates mới
            questions.forEach((q, idx) => {
                if (q.type === 'checkbox') {
                    // CHECKBOX: Lưu tỉ lệ cho từng option
                    const optionRates = {};
                    q.options.forEach((opt, optIdx) => {
                        const slider = document.getElementById(`option-slider-${idx}-${optIdx}`);
                        optionRates[opt] = parseFloat(slider.value);
                    });
                    q.option_rates = optionRates;
                } else {
                    // MULTIPLE CHOICE: Lưu phân bổ %
                    const optionRates = {};
                    q.options.forEach((opt, optIdx) => {
                        const slider = document.getElementById(`option-slider-${idx}-${optIdx}`);
                        optionRates[opt] = parseFloat(slider.value);
                    });
                    q.option_rates = optionRates;
                }
            });

            document.getElementById('submitSection').style.display = 'block';
            document.getElementById('submitSection').scrollIntoView({ behavior: 'smooth' });
            showAlert('✅ Đã lưu cấu hình. Bạn có thể auto submit ngay!', 'success');
        }

        async function autoSubmit() {
            const numResponses = parseInt(document.getElementById('numResponses').value);
            const delay = parseFloat(document.getElementById('submitDelay').value);

            if (!formData || !questions || questions.length === 0) {
                showAlert('Vui lòng import form trước!', 'error');
                return;
            }

            const progressDiv = document.getElementById('submitProgress');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            progressDiv.style.display = 'block';
            progressText.textContent = `Đang khởi tạo...`;
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';

            try {
                // BACKGROUND MODE: Submit 1 lần, server xử lý background
                const response = await fetch('/api/auto-submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        submit_url: formData.submit_url,
                        questions: questions,
                        num_responses: numResponses,
                        delay: delay
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    // Hiển thị chi tiết lỗi validation
                    if (data.details && Array.isArray(data.details)) {
                        const errorMsg = data.details.join('\n');
                        alert(`❌ ${data.error}:\n\n${errorMsg}`);
                        showAlert(`❌ ${data.error} - Xem chi tiết trong popup`, 'error');
                    } else {
                        showAlert(`❌ Lỗi: ${data.error}`, 'error');
                    }
                    progressDiv.style.display = 'none';
                    return;
                }

                const taskId = data.task_id;
                progressText.textContent = `✅ Đã bắt đầu! Task ID: ${taskId}`;
                showAlert(data.message, 'success');
                
                // Poll status mỗi 2 giây
                const pollInterval = setInterval(async () => {
                    try {
                        const statusResp = await fetch(`/api/task-status/${taskId}`);
                        const status = await statusResp.json();
                        
                        if (statusResp.ok) {
                            // Update progress bar
                            progressBar.style.width = status.progress + '%';
                            progressBar.textContent = Math.round(status.progress) + '%';
                            
                            // Update text with speed
                            let speedText = status.speed > 0 ? ` (${status.speed} req/s)` : '';
                            progressText.textContent = `Đang submit: ${status.success + status.failed}/${status.total} (${status.success} thành công, ${status.failed} lỗi)${speedText}`;
                            
                            // Check if completed
                            if (status.status === 'completed') {
                                clearInterval(pollInterval);
                                let durationText = status.duration ? ` trong ${status.duration}s` : '';
                                progressText.textContent = `✅ Hoàn thành: ${status.success}/${status.total} thành công${durationText}!`;
                                
                                if (status.failed > 0) {
                                    console.error('❌ Errors:', status.errors);
                                    showAlert(`⚠️ Có ${status.failed} lỗi. Chi tiết trong console (F12).`, 'warning');
                                } else {
                                    showAlert(`🎉 Đã submit thành công ${status.success}/${status.total} responses${durationText}!`, 'success');
                                }
                            }
                        }
                    } catch (error) {
                        console.error('Poll error:', error);
                    }
                }, 2000); // Poll every 2 seconds
                
            } catch (error) {
                showAlert(`❌ Lỗi: ${error.message}`, 'error');
                console.error('Submit error:', error);
            }
        }
    </script>
</body>
</html>
